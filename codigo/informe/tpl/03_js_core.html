<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const E=D.ext||{}, G=D.gasto||{}, X=D.extranjeros||{}, S=D.social||{}, MU=D.mundo||{};
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>{ const v=Number(n); if(!isFinite(v)) return '—'; const f=Math.abs(v).toFixed(d); const [i,fr]=f.split('.'); return (v<0?'−':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(fr?','+fr:''); };
const pct=(a,b)=>Math.round(100*a/b);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',n:'var(--neutral)'};
const tip=$('#tip');
const host=u=>u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
const dkey=s=>String(s).replace(/^\s*\d+\.\s*/,'');
const bname=s=>String(s).replace(/\s*\+\s*\d+\.\s*/g,' / ').replace(/\s+/g,' ').trim();
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fecha=iso=>{ const m=String(iso).match(/(\d{4})-(\d{2})-(\d{2})/); return m?(+m[3])+' de '+MESES[+m[2]-1]+' de '+m[1]:iso; };
const normD=s=>{ s=dkey(s); const m={"L'Eixample":"l'Eixample","L'Olivereta":"l'Olivereta","La Saïdia":"la Saïdia","El Pla del Real":"el Pla del Real"}; return m[s]||s; };
function showTip(e,html){ tip.innerHTML=html; tip.style.display='block'; const r=tip.getBoundingClientRect(); let x=e.clientX+12,y=e.clientY+12; if(x+r.width>innerWidth-8)x=e.clientX-r.width-12; if(y+r.height>innerHeight-8)y=e.clientY-r.height-12; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }
const cw=el=>{ const w=el.clientWidth||(el.parentElement&&el.parentElement.clientWidth)||720; return Math.max(300,Math.min(720,Math.round(w))); };
const REDRAW=new Map();

// ---------- gráfico de líneas con crosshair (eje derecho: sr.axis='r') ----------

// ---- registro de datos de cada gráfico: tabla y CSV descargables ----
const CDATA=new Map();
const xLab=x=>{ if(typeof x!=='number') return String(x); if(Number.isInteger(x)) return String(x); const y=Math.floor(x), mo=Math.round((x-y)*12+0.5); return y+'-'+String(Math.max(1,Math.min(12,mo))).padStart(2,'0'); };
function regData(el,cols,rows){ if(el&&el.id) CDATA.set(el.id,{cols,rows}); }
function regLine(el,o){ const xs=[...new Set(o.series.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>a-b); const mp=o.series.map(s=>new Map(s.pts.map(p=>[p[0],p[1]]))); regData(el,['Periodo',...o.series.map(s=>s.name||'Valor')],xs.map(x=>[xLab(x),...mp.map(m=>m.has(x)?m.get(x):'')])); }
function regBar(el,o){ const multi=Array.isArray(o.vals[0]); const nm=multi?(o.names||o.vals[0].map((_,i)=>'Serie '+(i+1))):[o.name||'Valor']; regData(el,['Categoría',...nm],o.cats.map((c,i)=>[c,...(multi?o.vals[i]:[o.vals[i]])])); }
function regGroup(el,o){ regData(el,['Categoría',...o.series.map(s=>s.name)],o.cats.map((c,i)=>[c,...o.series.map(s=>s.vals[i])])); }
function regH(el,rows){ const sub=rows.some(r=>r.sub); regData(el,['Categoría',...(sub?['Detalle']:[]),'Valor'],rows.map(r=>[r.l,...(sub?[r.sub||'']:[]),r.v])); }
function regStack(el,rows,names){ regData(el,['Categoría',...names],rows.map(r=>[r.l,...r.v])); }
function regScatter(el,pts,o){ regData(el,['Punto',o.xName||'X',o.yName||'Y'],pts.map(p=>[p.l!=null?p.l:(p.label||''),p.x,p.y])); }
const csvCell=v=>{ const t=v==null?'':String(v); return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
function toCSV(d){ return '﻿'+[d.cols,...d.rows].map(r=>r.map(csvCell).join(',')).join('\n'); }
const slug=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'datos';
function tableHtml(d){ const nf=v=>typeof v==='number'?fmt(v,Number.isInteger(v)?0:Math.min(2,(String(v).split('.')[1]||'').length)):esc(v); return '<table><thead><tr>'+d.cols.map((c,i)=>'<th'+(i?' class="n"':'')+'>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+r.map((v,i)=>'<td'+(i?' class="n"':'')+'>'+nf(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; }
function addDataTools(){ document.querySelectorAll('main figure').forEach(fig=>{ if(fig.querySelector('.dtools')) return; const el=[...fig.querySelectorAll('[id]')].find(e=>CDATA.has(e.id)); if(!el) return; const t=fig.querySelector('.t'); const name=t?t.firstChild.textContent.trim():el.id;
  const bar=document.createElement('div'); bar.className='dtools'; bar.innerHTML='<button type="button" class="lnkbtn" data-act="tab">Ver como tabla</button><button type="button" class="lnkbtn" data-act="csv">Descargar datos (CSV)</button>';
  const box=document.createElement('div'); box.className='tbl dtab'; box.hidden=true;
  bar.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=CDATA.get(el.id); if(!d) return;
    if(b.dataset.act==='tab'){ if(box.hidden){ box.innerHTML=tableHtml(d); box.hidden=false; b.textContent='Ocultar tabla'; } else { box.hidden=true; b.textContent='Ver como tabla'; } }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([toCSV(d)],{type:'text/csv;charset=utf-8'})); a.download='viviendavalencia-'+slug(name)+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); } });
  const cap=fig.querySelector('figcaption'); if(cap){ cap.after(bar); bar.after(box); } else { fig.append(bar,box); } }); }
function lineChart(el,o){
  REDRAW.set(el,()=>lineChart(el,o)); regLine(el,o);
  const W=cw(el),H=o.h||260,m={l:48,r:o.series.some(s=>s.axis==='r')?48:22,t:14,b:28}; const w=W-m.l-m.r,h=H-m.t-m.b;
  const L=o.series.filter(s=>s.axis!=='r'), R=o.series.filter(s=>s.axis==='r');
  const xs=o.series.flatMap(s=>s.pts.map(p=>p[0]));
  const x0=o.x0??Math.min(...xs), x1=o.x1??Math.max(...xs);
  const rng=(ss,a0,a1)=>{ const ys=ss.flatMap(s=>s.pts.map(p=>p[1])); let y0=a0??0, y1=a1??Math.max(...ys)*1.06; if(a0==null&&o.auto){ const mn=Math.min(...ys), mx=Math.max(...ys); const pad=(mx-mn)*0.15||1; y0=mn-pad; y1=mx+pad; } if(y1<=y0) y1=y0+1; return [y0,y1]; };
  const [y0,y1]=rng(L,o.y0,o.y1); const [r0,r1]=R.length?rng(R,o.r0,o.r1):[0,1];
  const X=v=>m.l+(v-x0)/(x1-x0)*w, Y=v=>m.t+h-(v-y0)/(y1-y0)*h, YR=v=>m.t+h-(v-r0)/(r1-r0)*h;
  const yt=ticks(y0,y1,5), xt=o.xt||yearTicks(x0,x1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" font-family="var(--body)" font-size="11">';
  for(const b of (o.bands||[])) s+='<rect x="'+X(b.x0)+'" y="'+m.t+'" width="'+(X(b.x1)-X(b.x0))+'" height="'+h+'" fill="var(--mark)" opacity=".35"/>';
  for(const t of yt) s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" fill="'+(R.length?(L[0]&&L[0].color||'var(--muted)'):'var(--muted)')+'">'+(o.yf?o.yf(t):fmt(t))+'</text>';
  if(R.length) for(const t of ticks(r0,r1,5)) s+='<text x="'+(W-m.r+6)+'" y="'+(YR(t)+4)+'" text-anchor="start" fill="'+R[0].color+'">'+(o.rf?o.rf(t):fmt(t))+'</text>';
  for(const t of xt) s+='<text x="'+X(t)+'" y="'+(H-8)+'" text-anchor="'+(X(t)>W-30?'end':X(t)<m.l+12?'start':'middle')+'" fill="var(--muted)">'+t+'</text>';
  for(const a0 of (o.ann||[])){ const a=Object.assign({},a0,{left:a0.left||(a0.leftNarrow&&W<520)}); s+='<line x1="'+X(a.x)+'" x2="'+X(a.x)+'" y1="'+m.t+'" y2="'+(m.t+h)+'" stroke="var(--fg)" stroke-dasharray="3 3" stroke-opacity=".5"/><text x="'+(a.left?(X(a.x)-4):(X(a.x)+4))+'"'+(a.left?' text-anchor="end"':'')+' y="'+(a.pos==='b'?(m.t+h-6):a.pos==='m'?(m.t+h*0.66):(m.t+10))+'" fill="var(--muted)" font-size="10.5">'+esc(a.label)+'</text>'; }
  const LBL=[];
  o.series.forEach((sr,i)=>{ const YY=sr.axis==='r'?YR:Y; const d=sr.pts.map((p,j)=>((j&&!(o.gap&&p[0]-sr.pts[j-1][0]>o.gap))?'L':'M')+X(p[0]).toFixed(1)+' '+YY(p[1]).toFixed(1)).join(' ');
    if(sr.area) s+='<path d="'+d+' L'+X(sr.pts[sr.pts.length-1][0]).toFixed(1)+' '+YY(sr.axis==='r'?r0:y0)+' L'+X(sr.pts[0][0]).toFixed(1)+' '+YY(sr.axis==='r'?r0:y0)+'Z" fill="'+sr.color+'" opacity=".1"/>';
    s+='<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="'+(sr.w||2.2)+'" stroke-linejoin="round"'+(sr.dash?' stroke-dasharray="5 4"':'')+'/>';
    if(sr.dots) for(const p of sr.pts) s+='<circle cx="'+X(p[0])+'" cy="'+YY(p[1])+'" r="3.5" fill="'+sr.color+'" stroke="var(--panel)" stroke-width="1.5"/>';
    const last=sr.pts[sr.pts.length-1]; s+='<circle cx="'+X(last[0])+'" cy="'+YY(last[1])+'" r="4" fill="'+sr.color+'" stroke="var(--panel)" stroke-width="2"/>';
    let ly=YY(last[1])-9; const lx=X(last[0])-6; for(let g=0;g<6&&LBL.some(q=>Math.abs(q[1]-ly)<13&&Math.abs(q[0]-lx)<90);g++) ly+= (ly<m.t+20?16:-16)*(g%2?-1:1)*(g+1); ly=Math.max(m.t+10,Math.min(m.t+h-4,ly)); if(sr.label!==false) LBL.push([lx,ly]);
    if(sr.label!==false) s+='<text x="'+lx+'" y="'+ly+'" text-anchor="end" fill="var(--fg)" font-weight="600">'+esc(sr.lf?sr.lf(last[1]):((sr.axis==='r'&&o.rf)?o.rf(last[1]):(o.yf?o.yf(last[1]):fmt(last[1]))))+'</text>';
  });
  s+='<line id="cx" x1="0" x2="0" y1="'+m.t+'" y2="'+(m.t+h)+'" stroke="var(--fg)" stroke-opacity=".4" style="display:none"/><rect x="'+m.l+'" y="'+m.t+'" width="'+w+'" height="'+h+'" fill="transparent" id="hit"/></svg>';
  el.innerHTML=s; const prev=el.previousElementSibling; if(prev&&prev.classList.contains('legend')) prev.remove();
  if(o.series.length>1&&o.legend!==false) el.insertAdjacentHTML('beforebegin','<div class="legend">'+o.series.map(sr=>'<span style="--c:'+sr.color+'">'+esc(sr.name)+'</span>').join('')+'</div>');
  const svg=el.querySelector('svg'), hit=svg.querySelector('#hit'), cx=svg.querySelector('#cx');
  hit.addEventListener('mousemove',e=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); const xv=x0+(p.x-m.l)/w*(x1-x0); cx.setAttribute('x1',p.x); cx.setAttribute('x2',p.x); cx.style.display='';
    const rows=o.series.map(sr=>{ let best=sr.pts[0]; for(const q of sr.pts) if(Math.abs(q[0]-xv)<Math.abs(best[0]-xv)) best=q; const f=sr.lf?sr.lf(best[1]):((sr.axis==='r'&&o.rf)?o.rf(best[1]):(o.yf?o.yf(best[1]):fmt(best[1]))); return '<div><b style="color:'+sr.color+'">■</b> '+esc(sr.name)+': <b>'+esc(f)+'</b> <span style="opacity:.7">'+(o.xf?o.xf(best[0]):Math.round(best[0]))+'</span></div>'; });
    showTip(e,rows.join('')); });
  hit.addEventListener('mouseleave',()=>{cx.style.display='none';hideTip();});
}
function ticks(a,b,n){ const r=niceStep((b-a)/n); const out=[]; for(let v=Math.ceil(a/r)*r; v<=b+1e-9; v+=r) out.push(+v.toFixed(6)); return out; }
function niceStep(x){ if(!(x>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p; }
function yearTicks(a,b){ const span=b-a, step=span>14?4:span>7?2:1; const out=[]; for(let y=Math.ceil(a); y<=b; y++) if(y%step===0) out.push(y); return out; }
const mkey=k=>{ const [y,mo]=k.split('-'); return +y+(+mo-0.5)/12; };
const mlabel=x=>{ const y=Math.floor(x), mo=Math.round((x-y)*12+0.5); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][Math.max(0,Math.min(11,mo-1))]+' '+y; };
const qkey=k=>{ const m=k.match(/(\d{4})T(\d)/); return +m[1]+(+m[2]-0.5)/4; };
const qlabel=x=>{ const y=Math.floor(x); return Math.round((x-y)*4+0.5)+'T '+y; };

// ---------- barras verticales (apiladas si vals[i] es array) ----------
function barChart(el,o){
  REDRAW.set(el,()=>barChart(el,o)); regBar(el,o);
  const W=cw(el),H=o.h||220,m={l:44,r:10,t:16,b:26}; const w=W-m.l-m.r,h=H-m.t-m.b;
  const n=o.cats.length, tot=o.vals.map(v=>Array.isArray(v)?v.reduce((a,b)=>a+b,0):v), ymax=o.y1||Math.max(...tot)*1.1, ymin=o.y0||0;
  const Y=v=>m.t+h-(v-ymin)/(ymax-ymin)*h, bw=w/n, bar=Math.min(bw*0.68,60);
  let s='<svg viewBox="0 0 '+W+' '+H+'" font-family="var(--body)" font-size="11">';
  for(const t of ticks(ymin,ymax,4)) s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" fill="var(--muted)">'+(o.yf?o.yf(t):fmt(t))+'</text>';
  o.cats.forEach((c,i)=>{ const x=m.l+bw*i+(bw-bar)/2; let v=o.vals[i]; const segs=Array.isArray(v)?v:[v]; let acc=ymin;
    segs.forEach((sv,k)=>{ const y1=Y(acc), y2=Y(acc+sv); s+='<rect x="'+x+'" y="'+y2+'" width="'+bar+'" height="'+Math.max(0,y1-y2-(k?2:0))+'" fill="'+((o.colors||[C.s1])[k]||C.s1)+'"><title>'+esc(c)+(o.names?' · '+esc(o.names[k]):'')+': '+fmt(sv)+'</title></rect>'; acc+=sv; });
    if(o.labels!==false&&((n<=14&&bw>=34)||i===n-1)) s+='<text x="'+(x+bar/2)+'" y="'+(Y(acc)-4)+'" text-anchor="middle" fill="var(--fg)" font-size="10.5">'+(o.vf?o.vf(acc):fmt(acc))+'</text>';
    const every=Math.max(1,Math.ceil(n*Math.max(30,String(c).length*6.2+6)/w)); if(i%every===0||i===n-1) s+='<text x="'+(x+bar/2)+'" y="'+(H-8)+'" text-anchor="middle" fill="var(--muted)">'+esc(c)+'</text>';
  });
  s+='</svg>'; el.innerHTML=s; { const pv=el.previousElementSibling; if(pv&&pv.classList.contains('legend')) pv.remove(); }
  if(o.names) el.insertAdjacentHTML('beforebegin','<div class="legend">'+o.names.map((nm,k)=>'<span class="sq" style="--c:'+(o.colors[k])+'">'+esc(nm)+'</span>').join('')+'</div>');
}
function groupBars(el,o){
  REDRAW.set(el,()=>groupBars(el,o)); regGroup(el,o);
  const W=cw(el),n=o.cats.length,k=o.series.length; const bw0=(W-54)/n, rot=bw0<64;
  const H=(o.h||240)+(rot?34:0),m={l:44,r:10,t:16,b:rot?74:40}; const w=W-m.l-m.r,h=H-m.t-m.b;
  const ymax=o.y1||Math.max(...o.series.flatMap(s=>s.vals))*1.1;
  const Y=v=>m.t+h-v/ymax*h, bw=w/n, gw=bw*0.8, bar=gw/k;
  let s='<svg viewBox="0 0 '+W+' '+H+'" font-family="var(--body)" font-size="11">';
  for(const t of ticks(0,ymax,4)) s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" fill="var(--muted)">'+(o.yf?o.yf(t):fmt(t))+'</text>';
  o.cats.forEach((c,i)=>{ const x0=m.l+bw*i+(bw-gw)/2; o.series.forEach((sr,j)=>{ const v=sr.vals[i]||0; s+='<rect x="'+(x0+bar*j)+'" y="'+Y(v)+'" width="'+Math.max(1,bar-1.5)+'" height="'+(m.t+h-Y(v))+'" fill="'+sr.color+'"><title>'+esc(c)+' · '+esc(sr.name)+': '+fmt(v)+'</title></rect>'; });
    const cx=x0+gw/2, ly=m.t+h+12, lbl=c.length>14?c.slice(0,13)+'…':c;
    s+=rot?'<text transform="translate('+cx+' '+ly+') rotate(-45)" text-anchor="end" fill="var(--muted)">'+esc(lbl)+'</text>':'<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" fill="var(--muted)">'+esc(lbl)+'</text>'; });
  s+='</svg>'; el.innerHTML=s; { const pv=el.previousElementSibling; if(pv&&pv.classList.contains('legend')) pv.remove(); }
  el.insertAdjacentHTML('beforebegin','<div class="legend">'+o.series.map(sr=>'<span class="sq" style="--c:'+sr.color+'">'+esc(sr.name)+'</span>').join('')+'</div>');
}
function barsH(el,rows,o={}){ regH(el,rows); const mx=o.max||Math.max(...rows.map(r=>r.v)); el.innerHTML=rows.map(r=>'<div class="lbl" title="'+esc(r.l)+'">'+esc(r.l)+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div><div class="trk"><div class="fill'+(r.c?' '+r.c:'')+'" style="width:'+(100*Math.max(0,r.v)/mx)+'%"></div></div><div class="val">'+(o.vf?o.vf(r.v):fmt(r.v))+(r.vs?' <small>'+esc(r.vs)+'</small>':'')+'</div>').join(''); }
function stackRows(el,rows,names,colors){ regStack(el,rows,names); el.innerHTML='<div class="stackleg">'+names.map((n,i)=>'<span style="--c:'+colors[i]+'">'+esc(n)+'</span>').join('')+'</div>'+rows.map(r=>{ const t=r.v.reduce((a,b)=>a+b,0)||1; return '<div style="display:grid;grid-template-columns:minmax(100px,30%) 1fr;gap:8px;align-items:center;font-size:13px;margin:3px 0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+esc(r.l)+'">'+esc(r.l)+'</div><div class="stack" style="margin:0">'+r.v.map((v,i)=>'<div style="width:'+(100*v/t)+'%;background:'+colors[i]+'" title="'+esc(names[i])+': '+fmt(v)+' ('+Math.round(100*v/t)+' %)"></div>').join('')+'</div></div>'; }).join(''); }
function scatterChart(el,pts,o={}){
  REDRAW.set(el,()=>scatterChart(el,pts,o)); regScatter(el,pts,o);
  const W=cw(el),H=o.h||300,m={l:52,r:16,t:14,b:34}; const w=W-m.l-m.r,h=H-m.t-m.b;
  if(pts.length<2){ el.innerHTML='<p class="sub">Sin puntos en común.</p>'; return null; }
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const pad=(a,b)=>{ const d=(b-a)||Math.abs(a)||1; return [a-d*0.08,b+d*0.08]; };
  const [x0,x1]=pad(Math.min(...xs),Math.max(...xs)), [y0,y1]=pad(Math.min(...ys),Math.max(...ys));
  const X=v=>m.l+(v-x0)/(x1-x0)*w, Y=v=>m.t+h-(v-y0)/(y1-y0)*h;
  const st=stats(xs,ys);
  let s='<svg viewBox="0 0 '+W+' '+H+'" font-family="var(--body)" font-size="11">';
  for(const t of ticks(y0,y1,5)) s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" fill="var(--muted)">'+(o.yf?o.yf(t):fmt(t))+'</text>';
